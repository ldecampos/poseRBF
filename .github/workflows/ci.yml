name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Create the environment
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Check formatting
        run: .venv/bin/ruff format --check .

      - name: Check the types
        run: .venv/bin/pyright

      - name: Check the layer contracts
        run: .venv/bin/lint-imports

  test:
    runs-on: ${{ matrix.os }}
    name: test (python ${{ matrix.python }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Maya 2025 and 2026 run Python 3.11; Maya 2027, 3.13.
        python: ["3.11", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package and pytest
        run: python -m pip install . "pytest>=8.0"

      - name: Run the tests that need no Maya
        run: python -m pytest
